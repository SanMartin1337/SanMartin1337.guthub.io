<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E1013">
<title>Sortirovka</title>
<style>
:root{--bg:#0E1013;--card:#161A20;--line:#2A303A;--acc:#7C83FF;--text:#E8EAF0;--mute:#8B93A3;--ok:#3DDC97;--warn:#F5B849;--err:#FF6B6B}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:max(28px,env(safe-area-inset-top)) 20px max(28px,env(safe-area-inset-bottom))}
main{max-width:620px;margin:0 auto}
small{color:var(--mute)}
.tag{color:var(--acc);font-size:12px;font-weight:700;letter-spacing:.08em}
h1{margin:2px 0 6px;font-size:28px}
#zone{display:block;margin-top:22px;padding:44px 16px;text-align:center;background:var(--card);border:2px dashed var(--line);border-radius:24px;cursor:pointer}
#zone.on,#zone:hover{border-color:var(--acc)}
#zone b{display:block;font-size:18px;margin:10px 0 4px}
.ico{width:60px;height:60px;border-radius:50%;background:#222850;color:var(--acc);font-size:30px;line-height:60px;margin:0 auto}
input{display:none}
.card{margin-top:14px;padding:14px 16px;background:var(--card);border:1px solid var(--line);border-radius:14px}
.card b{word-break:break-all}
.card p{margin:4px 0 0;font-size:14px}
button{margin-top:12px;width:100%;padding:12px;border:0;border-radius:10px;background:var(--acc);color:#fff;font-weight:700;font-size:16px;font-family:inherit}
.bar{height:6px;margin-top:14px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;width:35%;height:100%;background:var(--acc);animation:go 1s infinite linear}
@keyframes go{from{margin-left:-35%}to{margin-left:100%}}
</style>
</head>
<body>
<main>
  <div class="tag">SORTIROVKA</div>
  <h1>Сортировка по моделям</h1>
  <small>Загрузите один или несколько файлов Excel — получите одну сводку по моделям. Файлы остаются на вашем устройстве.</small>
  <label id="zone"><div class="ico">↑</div><b>Выберите Excel-файлы</b><small>можно сразу несколько · формат .xlsx</small>
    <input id="file" type="file" accept=".xlsx" multiple></label>
  <div id="out"></div>
</main>
<script>
// ---------- zip: чтение (через встроенный DecompressionStream) ----------
const dec = new TextDecoder(), enc = new TextEncoder();
const u16 = (d, o) => d[o] | d[o + 1] << 8;
const u32 = (d, o) => (d[o] | d[o + 1] << 8 | d[o + 2] << 16 | d[o + 3] << 24) >>> 0;

function unzip(buf) {
  const d = new Uint8Array(buf);
  let e = d.length - 22;
  while (e >= 0 && u32(d, e) !== 0x06054b50) e--;
  if (e < 0) throw new Error('not zip');
  const out = {};
  let p = u32(d, e + 16);
  for (let i = u16(d, e + 10); i > 0; i--) {
    const nl = u16(d, p + 28), xl = u16(d, p + 30), cl = u16(d, p + 32), lo = u32(d, p + 42);
    const start = lo + 30 + u16(d, lo + 26) + u16(d, lo + 28);
    out[dec.decode(d.subarray(p + 46, p + 46 + nl))] = { m: u16(d, p + 10), raw: d.subarray(start, start + u32(d, p + 20)) };
    p += 46 + nl + xl + cl;
  }
  return out;
}
async function readEntry(z, name) {
  const f = z[name];
  if (!f) return null;
  if (f.m === 0) return dec.decode(f.raw);
  const s = new Blob([f.raw]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
  return dec.decode(await new Response(s).arrayBuffer());
}

// ---------- xlsx: чтение ----------
const unesc = s => s.replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"').replace(/&apos;/g, "'")
  .replace(/&#(\d+);/g, (m, c) => String.fromCharCode(c)).replace(/&amp;/g, '&');
const texts = x => [...x.matchAll(/<t(?:\s[^>]*)?>([\s\S]*?)<\/t>/g)].map(m => unesc(m[1])).join('');
const colNum = r => [...r.replace(/\d/g, '')].reduce((n, ch) => n * 26 + ch.charCodeAt(0) - 64, 0) - 1;
const norm = v => String(v ?? '').trim().toLowerCase();

function findCols(h) {
  const n = h.map(norm), model = n.indexOf('модель'), size = n.indexOf('размер');
  const sscc = n.findIndex(x => x.includes('sscc'));
  return model < 0 || size < 0 || sscc < 0 ? null : [model, sscc, size];
}

async function readTable(file) {
  let z;
  try { z = unzip(await file.arrayBuffer()); } catch (e) { throw new Error('не удалось открыть файл. Нужен обычный Excel (.xlsx).'); }
  const ssXml = await readEntry(z, 'xl/sharedStrings.xml');
  const ss = ssXml ? [...ssXml.matchAll(/<si\b[^>]*>([\s\S]*?)<\/si>/g)].map(m => texts(m[1])) : [];
  const sheets = Object.keys(z).filter(n => /^xl\/worksheets\/sheet\d+\.xml$/.test(n)).sort((a, b) => a.localeCompare(b, 'en', { numeric: true }));
  for (const name of sheets) {
    const xml = await readEntry(z, name);
    let header = null, cols = null;
    const rows = [];
    for (const rm of xml.matchAll(/<row\b(?:[^>\/]|\/(?!>))*>([\s\S]*?)<\/row>/g)) {
      const row = [];
      for (const cm of rm[1].matchAll(/<c\b([^>]*?)(?:\/>|>([\s\S]*?)<\/c>)/g)) {
        const ref = /\br="([A-Z]+\d+)"/.exec(cm[1]), t = /\bt="(\w+)"/.exec(cm[1]);
        const body = cm[2] || '', v = /<v>([\s\S]*?)<\/v>/.exec(body);
        let val = '';
        if (t && t[1] === 's') val = ss[+v[1]] ?? '';
        else if (t && t[1] === 'inlineStr') val = texts(body);
        else if (v) val = unesc(v[1]);
        if (ref) row[colNum(ref[1])] = val;
      }
      for (let i = 0; i < row.length; i++) if (row[i] === undefined) row[i] = '';
      if (!header) { const c = findCols(row); if (c) { header = row; cols = c; } continue; }
      if (row.every(v => String(v).trim() === '')) continue;
      while (row.length < header.length) row.push('');
      rows.push(row);
    }
    if (header) {
      if (!rows.length) throw new Error('есть заголовки, но нет строк с данными.');
      return { header, rows, cols };
    }
  }
  throw new Error('не нашёл колонки «Модель», «Код упаковки SSCC» и «Размер».');
}

// ---------- xlsx: запись (zip без сжатия) ----------
const CRC = (() => { const t = []; for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ c >>> 1 : c >>> 1; t[n] = c >>> 0; } return t; })();
const crc32 = d => { let c = -1; for (let i = 0; i < d.length; i++) c = CRC[(c ^ d[i]) & 255] ^ c >>> 8; return (c ^ -1) >>> 0; };

function zip(files) {
  const parts = [], central = [];
  let off = 0;
  for (const [name, text] of Object.entries(files)) {
    const nb = enc.encode(name), data = enc.encode(text), crc = crc32(data);
    const l = new DataView(new ArrayBuffer(30));
    [[0, 0x04034b50, 4], [4, 20, 2], [6, 0x0800, 2], [10, 0, 2], [12, 0x21, 2], [14, crc, 4], [18, data.length, 4], [22, data.length, 4], [26, nb.length, 2]]
      .forEach(([o, v, s]) => s === 4 ? l.setUint32(o, v, true) : l.setUint16(o, v, true));
    const c = new DataView(new ArrayBuffer(46));
    [[0, 0x02014b50, 4], [4, 20, 2], [6, 20, 2], [8, 0x0800, 2], [14, 0x21, 2], [16, crc, 4], [20, data.length, 4], [24, data.length, 4], [28, nb.length, 2], [42, off, 4]]
      .forEach(([o, v, s]) => s === 4 ? c.setUint32(o, v, true) : c.setUint16(o, v, true));
    parts.push(new Uint8Array(l.buffer), nb, data);
    central.push(new Uint8Array(c.buffer), nb);
    off += 30 + nb.length + data.length;
  }
  const csize = central.reduce((s, a) => s + a.length, 0), n = Object.keys(files).length;
  const e = new DataView(new ArrayBuffer(22));
  e.setUint32(0, 0x06054b50, true); e.setUint16(8, n, true); e.setUint16(10, n, true); e.setUint32(12, csize, true); e.setUint32(16, off, true);
  const all = [...parts, ...central, new Uint8Array(e.buffer)];
  const out = new Uint8Array(off + csize + 22);
  let p = 0;
  for (const a of all) { out.set(a, p); p += a.length; }
  return out;
}

// спецсимволы пишем как _x001D_ — так делает сам Excel, данные не теряются
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
  .replace(/[\x00-\x08\x0b\x0c\x0e-\x1f]/g, c => '_x' + c.charCodeAt(0).toString(16).toUpperCase().padStart(4, '0') + '_');
const ref = (r, c) => { let s = '', n = c + 1; while (n) { s = String.fromCharCode(65 + (n - 1) % 26) + s; n = Math.floor((n - 1) / 26); } return s + r; };
const NS = 'http://schemas.openxmlformats.org/spreadsheetml/2006/main';
const HEAD = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>';

function sheetXml(rows) {
  const n = Math.max(...rows.map(r => r.length));
  const cols = Array.from({ length: n }, (_, j) => {
    const w = Math.max(10, Math.min(60, Math.max(...rows.map(r => String(r[j] ?? '').length)) + 3));
    return `<col min="${j + 1}" max="${j + 1}" width="${w}" customWidth="1"/>`;
  }).join('');
  let x = `${HEAD}<worksheet xmlns="${NS}"><sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews><cols>${cols}</cols><sheetData>`;
  rows.forEach((r, i) => {
    x += `<row r="${i + 1}">`;
    r.forEach((v, j) => {
      if (v === '' || v == null) return;
      const a = ref(i + 1, j), s = i ? '' : ' s="1"';
      x += typeof v === 'number' ? `<c r="${a}"${s}><v>${v}</v></c>`
        : `<c r="${a}" t="inlineStr"${s}><is><t xml:space="preserve">${esc(v)}</t></is></c>`;
    });
    x += '</row>';
  });
  return x + '</sheetData></worksheet>';
}

function makeXlsx(sheets) { // sheets: [[имя, строки], ...]
  const f = {};
  f['[Content_Types].xml'] = `${HEAD}<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>${sheets.map((s, i) => `<Override PartName="/xl/worksheets/sheet${i + 1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('')}</Types>`;
  f['_rels/.rels'] = `${HEAD}<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`;
  f['xl/workbook.xml'] = `${HEAD}<workbook xmlns="${NS}" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>${sheets.map((s, i) => `<sheet name="${esc(s[0])}" sheetId="${i + 1}" r:id="rId${i + 1}"/>`).join('')}</sheets></workbook>`;
  f['xl/_rels/workbook.xml.rels'] = `${HEAD}<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${sheets.map((s, i) => `<Relationship Id="rId${i + 1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i + 1}.xml"/>`).join('')}<Relationship Id="rId${sheets.length + 1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`;
  f['xl/styles.xml'] = `${HEAD}<styleSheet xmlns="${NS}"><fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><color rgb="FFFFFFFF"/><name val="Calibri"/></font></fonts><fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FF2B3140"/></patternFill></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="2"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="2" borderId="0" xfId="0" applyFont="1" applyFill="1"/></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>`;
  sheets.forEach((s, i) => { f[`xl/worksheets/sheet${i + 1}.xml`] = sheetXml(s[1]); });
  return zip(f);
}

// ---------- логика сортировки ----------
const PER_BOX = 8;
const sizeKey = v => { const n = parseFloat(String(v).replace(',', '.')); return isNaN(n) ? [1, 0, String(v)] : [0, n, '']; };
const cmp = (a, b) => a < b ? -1 : a > b ? 1 : 0;
const cmpSize = (a, b) => { const x = sizeKey(a), y = sizeKey(b); return cmp(x[0], y[0]) || cmp(x[1], y[1]) || cmp(x[2], y[2]); };

function sheetName(name, used) {
  let n = (name.replace(/[\[\]:*?\/\\]/g, '_').replace(/^'+|'+$/g, '') || 'Лист').slice(0, 31), base = n, i = 2;
  while (used.has(n.toLowerCase())) { const s = '_' + i++; n = base.slice(0, 31 - s.length) + s; }
  used.add(n.toLowerCase());
  return n;
}

function outName(files) {
  const stems = files.map(f => f.name.replace(/\.[^.]+$/, ''));
  let n = stems.join('_');
  if (n.length > 80) n = stems[0] + '_plus' + (stems.length - 1);
  return n + '_sortirovka.xlsx';
}

async function processFiles(files, progress) {
  let header = null, cols = null;
  const all = [], stats = [];
  for (let i = 0; i < files.length; i++) {
    progress && progress(files[i].name, i + 1, files.length);
    let t;
    try { t = await readTable(files[i]); } catch (e) { throw new Error(files[i].name + ': ' + e.message); }
    if (!header) { header = t.header; cols = t.cols; }
    else if (t.header.map(norm).join('\u0001') !== header.map(norm).join('\u0001'))
      throw new Error(`${files[i].name}: колонки не совпадают с первым файлом (${files[0].name}). Все файлы должны быть одного формата.`);
    t.rows.forEach(r => all.push(r));
    stats.push([files[i].name, t.rows.length]);
  }
  const [cm, cs, cz] = cols, groups = {}, items = {}, models = {};
  for (const r of all) {
    const m = String(r[cm]).trim() || '(без модели)';
    (groups[m] = groups[m] || []).push(r);
    const s = String(r[cs]).trim();
    if (s) { items[s] = (items[s] || 0) + 1; (models[s] = models[s] || new Set()).add(m); }
  }
  const names = Object.keys(groups).sort();
  names.forEach(m => groups[m].sort((a, b) => cmp(String(a[cs]), String(b[cs])) || cmpSize(a[cz], b[cz])));

  const sizes = [...new Set(all.map(r => String(r[cz])))].sort(cmpSize);
  const sum = [['Модель', 'Коробов', 'Пар', ...sizes]], tot = ['ИТОГО', 0, 0, ...sizes.map(() => 0)];
  for (const m of names) {
    const g = groups[m], line = [m, new Set(g.map(r => String(r[cs]))).size, g.length, ...sizes.map(s => g.filter(r => String(r[cz]) === s).length)];
    sum.push(line);
    for (let i = 1; i < line.length; i++) tot[i] += line[i];
  }
  sum.push(tot);
  if (files.length > 1) sum.push([], ['Обработанные файлы', 'Пар'], ...stats);

  const used = new Set(['сводка']);
  const bytes = makeXlsx([['Сводка', sum], ...names.map(m => [sheetName(m, used), [header, ...groups[m]]])]);
  const ids = Object.keys(items);
  return {
    bytes, name: outName(files), files: files.length, models: names.length, boxes: ids.length, pairs: all.length,
    bad: ids.filter(s => items[s] > PER_BOX || models[s].size > 1).length,
    incomplete: ids.filter(s => items[s] < PER_BOX).length
  };
}

if (typeof module !== 'undefined') module.exports = { processFiles };

// ---------- интерфейс ----------
if (typeof document !== 'undefined') {
  const $ = id => document.getElementById(id), out = $('out'), zone = $('zone');
  const plural = (n, f) => { const a = n % 10, b = n % 100; return a === 1 && b !== 11 ? f[0] : a >= 2 && a <= 4 && (b < 12 || b > 14) ? f[1] : f[2]; };
  const fmt = n => n.toLocaleString('ru-RU');
  const card = (html, color) => { const d = document.createElement('div'); d.className = 'card'; d.style.borderColor = color || ''; d.innerHTML = html; out.appendChild(d); return d; };
  const safe = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  async function run(list) {
    out.innerHTML = '';
    const seen = new Set(), files = list.filter(f => { const k = f.name + f.size; return !seen.has(k) && seen.add(k); });
    const bad = files.filter(f => !/\.xlsx$/i.test(f.name) || f.name.startsWith('~$'));
    if (bad.length) {
      bad.forEach(f => card(`<b>${safe(f.name)}</b><p style="color:var(--err)">Нужен файл .xlsx. Если у вас .xls — сохраните его как «Книга Excel (.xlsx)». Уберите этот файл и загрузите всё заново.</p>`, 'var(--err)'));
      return;
    }
    const wait = card('<b id="cur">Обрабатываю…</b><div class="bar"><i></i></div>');
    await new Promise(r => setTimeout(r, 30));
    try {
      const r = await processFiles(files, (n, i, t) => { $('cur').textContent = t > 1 ? `${n} (${i} из ${t})` : n; });
      wait.remove();
      const st = [...(r.files > 1 ? [`${r.files} ${plural(r.files, ['файл', 'файла', 'файлов'])}`] : []),
        `${r.models} ${plural(r.models, ['модель', 'модели', 'моделей'])}`, `${fmt(r.boxes)} ${plural(r.boxes, ['короб', 'короба', 'коробов'])}`,
        `${fmt(r.pairs)} ${plural(r.pairs, ['пара', 'пары', 'пар'])}`].join(' · ');
      const c = card(`<b>${safe(r.name)}</b><p><small>${st}</small></p>` +
        (r.bad ? `<p style="color:var(--warn)">Внимание: в ${r.bad} ${plural(r.bad, ['коробе', 'коробах', 'коробах'])} больше ${PER_BOX} пар или смешаны разные модели — проверьте исходник</p>` : '') +
        (r.incomplete ? `<p><small>Неполных коробов (меньше ${PER_BOX} пар): ${fmt(r.incomplete)}</small></p>` : '') +
        '<button>Скачать</button>', 'var(--ok)');
      c.querySelector('button').onclick = () => {
        const a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob([r.bytes], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }));
        a.download = r.name; document.body.appendChild(a); a.click(); a.remove();
      };
    } catch (e) {
      wait.remove();
      card(`<b>Не удалось обработать</b><p style="color:var(--err)">${safe(e.message)}</p>`, 'var(--err)');
    }
  }
  $('file').onchange = e => { const l = [...e.target.files]; e.target.value = ''; if (l.length) run(l); };
  ['dragenter', 'dragover'].forEach(t => zone.addEventListener(t, e => { e.preventDefault(); zone.classList.add('on'); }));
  ['dragleave', 'drop'].forEach(t => zone.addEventListener(t, e => { e.preventDefault(); zone.classList.remove('on'); }));
  zone.addEventListener('drop', e => { const l = [...e.dataTransfer.files]; if (l.length) run(l); });
}
</script>
</body>
</html>
